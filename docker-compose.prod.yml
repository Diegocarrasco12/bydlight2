# Produccion de bydlight2 en el servidor propio. Lo opera SOLO el ejecutor bd-deploy
# (proyecto Docker `bydlight-prod`, ver deploy/executor y DEPLOY.md); no usar a mano con otro nombre de proyecto.
# El puerto se publica unicamente en 127.0.0.1: lo expone el Cloudflare Tunnel del servidor.
# BD_TAG lo fija el ejecutor (sha corto del commit construido); la politica del ejecutor valida esta configuracion.
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: bydlight-web:${BD_TAG:-local}
    restart: unless-stopped
    user: "1000:1000"
    init: true
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache:uid=1000,gid=1000,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    ports:
      - "127.0.0.1:8200:3000"
    networks:
      - app
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  app: {}
